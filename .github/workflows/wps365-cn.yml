name: Build wps365-cn

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  flake-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            accept-flake-config = true
            allow-import-from-derivation = true

      - name: Configure Nix for unfree packages
        run: |
          mkdir -p ~/.config/nixpkgs
          echo '{ allowUnfree = true; }' > ~/.config/nixpkgs/config.nix

      - name: Check flake
        run: nix flake check --impure

  build-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            accept-flake-config = true
            allow-import-from-derivation = true

      - name: Configure Nix for unfree packages
        run: |
          mkdir -p ~/.config/nixpkgs
          echo '{ allowUnfree = true; }' > ~/.config/nixpkgs/config.nix

      - name: Build wps365-cn (x86_64-linux)
        run: nix build .#packages.x86_64-linux.wps365-cn --print-out-paths --impure

  build-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            accept-flake-config = true
            allow-import-from-derivation = true
            extra-platforms = aarch64-linux arm-linux

      - name: Configure Nix for unfree packages
        run: |
          mkdir -p ~/.config/nixpkgs
          echo '{ allowUnfree = true; }' > ~/.config/nixpkgs/config.nix

      - name: Build wps365-cn (aarch64-linux)
        run: nix build .#packages.aarch64-linux.wps365-cn --print-out-paths --impure

  build-loongarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            accept-flake-config = true
            allow-import-from-derivation = true
            extra-platforms = loongarch64-linux
            extra-substituters = https://cache.nix4loong.cn
            extra-trusted-public-keys = cache.nix4loong.cn-1:zmkwLihdSUyy6OFSVgvK3br0EaUEczLiJgDfvOmm3pA=

      - name: Configure Nix for unfree packages
        run: |
          mkdir -p ~/.config/nixpkgs
          echo '{ allowUnfree = true; }' > ~/.config/nixpkgs/config.nix

      - name: Build wps365-cn (loongarch64-linux, cache-only)
        run: |
          # Use nix4loong binary cache and avoid local source builds in QEMU.
          # If cache is missing artifacts, fail fast instead of timing out building glibc.
          nix build .#packages.loongarch64-linux.wps365-cn --max-jobs 0 --print-out-paths --impure