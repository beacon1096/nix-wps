name: Build wps365-cn

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-22.04
          - system: aarch64-linux
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            accept-flake-config = true
            allow-import-from-derivation = true
            extra-platforms = aarch64-linux arm-linux

      - name: Configure Nix for unfree packages
        run: |
          mkdir -p ~/.config/nixpkgs
          echo '{ allowUnfree = true; }' > ~/.config/nixpkgs/config.nix

      - name: Build wps365-cn
        run: nix build .#packages.${{ matrix.system }}.wps365-cn --print-out-paths --impure
