name: Build wpsoffice-cn

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-22.04
          - system: x86_64-darwin
            os: macos-15-intel
          - system: aarch64-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            accept-flake-config = true
            allow-import-from-derivation = true

      - name: Configure Nix for unfree packages
        run: |
          mkdir -p ~/.config/nixpkgs
          echo '{ allowUnfree = true; }' > ~/.config/nixpkgs/config.nix

      - name: Build wpsoffice-cn
        run: nix build .#packages.${{ matrix.system }}.wpsoffice-cn --print-out-paths --impure
